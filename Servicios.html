<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <title>Administrar Servicios</title>
    <?!= HtmlService.createHtmlOutputFromFile("Estilos").getContent(); ?>
</head>

<body>

    <div id="modalOverlay" class="modal-overlay" style="display: none;" onclick="ocultarModal('modalServicio')"></div>

    <div class="barraTopComercial">
        <div class="topBarra-izquierda">
            <? var url = getScriptUrl(); ?>
            <a href='<?= url ?>?page=Modulos' class="retornarModulos iconoTopBarra">Modulos</a>
            <h1>Administración de Servicios</h1>
        </div>
    </div>

    <div class="contenido-servicios">

        <div style="margin-bottom: 20px;">
            <button onclick="mostrarFormularioServicio('nuevo')" class="btn-guardar-top">➕ Añadir Nuevo Servicio</button>
            <button onclick="navegarAOT()" class="boton-nuevo-pedido">🔧 Órdenes de Trabajo</button>
        </div>

        <h2>Lista de Servicios Registrados</h2>
        
        <div style="overflow-x: auto;">
            <table id="tablaServicios" class="tabla-listado servicios-tabla">
                <thead>
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th style="min-width: 250px;">DESCRIPCIÓN</th>
                        <th style="width: 120px;">H. SEGÚN</th>
                        <th style="width: 100px;">UND. MEDIDA</th>
                        <th style="width: 100px;">ACCIÓN</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaServicios">
                    <tr><td colspan="5" style="text-align: center;">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="modalServicio" class="card modal-flotante modal-pequeno" style="display:none;">
            <button class="modal-close-btn" onclick="ocultarModal('modalServicio')">✖</button>
            
            <h3 id="tituloModalServicio">Añadir Nuevo Servicio</h3>
            
            <form id="formServicio" class="formulario-campos">
                <input type="hidden" id="servicioRowIndex" name="rowIndex" value="0"> 
                
                <h2>ID SERVICIO (COD)</h2>
                <input type="text" id="servicioID" name="ID Servicio" placeholder="S001" required>

                <h2>DESCRIPCIÓN DEL SERVICIO</h2>
                <textarea id="servicioDescripcion" name="Descripción del Servicio" placeholder="Instalación de tuberías de 4 pulgadas..." rows="3" required></textarea>

                <h2>HORA SEGÚN</h2>
                <select id="servicioHoraSegun" name="Hora según">
                </select>

                <h2>UND. MEDIDA</h2>
                <select id="servicioUndMedida" name="Und. Medida">
                </select>
                
                <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 20px;">
                    <button type="button" onclick="guardarServicio()" class="btn-guardar-top">Guardar Servicio</button>
                    <button type="button" onclick="ocultarModal('modalServicio')">Cancelar</button>
                </div>
            </form>
        </div>

    </div>

    <script>
    let dataServicios = [];
    let listaHoraSegun = [];
    let listaUndMedida = [];

    // Ejecución al cargar la página
    document.addEventListener("DOMContentLoaded", function() {
        mostrarLoading(true, "Cargando servicios...");
        google.script.run
            .withSuccessHandler(procesarDatosIniciales)
            .withFailureHandler(mostrarError)
            .getDatosInicialesServicios(); 
    });

    function mostrarLoading(mostrar, mensaje) {
        // Implementación simple de loading si no existe overlay global
        if(mostrar) console.log("⏳ " + mensaje);
    }
    
    function mostrarError(error) {
        console.error("Error del servidor:", error);
        alert("Error: " + error.message);
    }

    function procesarDatosIniciales(data) {
        mostrarLoading(false);
        if (!data.success && data.message) {
            alert("Error al cargar datos: " + data.message);
            return;
        }

        dataServicios = data.servicios || [];
        listaHoraSegun = data.horasSegun || [];
        listaUndMedida = data.undMedida || [];
        
        // Llenar las listas de selección (selects)
        llenarSelect('servicioHoraSegun', listaHoraSegun);
        llenarSelect('servicioUndMedida', listaUndMedida);
        
        // Renderizar la tabla
        cargarTablaServicios(dataServicios);
    }
    
    function llenarSelect(id, opciones) {
        const select = document.getElementById(id);
        if(!select) return;
        select.innerHTML = '<option value="" disabled selected>-- Seleccione --</option>';
        if (opciones) {
            opciones.forEach(opcion => {
                const opt = document.createElement('option');
                opt.value = opcion;
                opt.textContent = opcion;
                select.appendChild(opt);
            });
        }
    }
    
    function mostrarModal(id) {
        const overlay = document.getElementById('modalOverlay');
        const modal = document.getElementById(id);
        if(overlay) overlay.style.display = 'block';
        if(modal) modal.style.display = 'block';
    }
    
    function ocultarModal(id) {
        const overlay = document.getElementById('modalOverlay');
        const modal = document.getElementById(id);
        if(modal) modal.style.display = 'none';
        if(overlay) overlay.style.display = 'none';
    }

    /**
     * Carga la tabla adaptada para los objetos de Supabase.
     */
    function cargarTablaServicios(data) {
        const tbody = document.getElementById("cuerpoTablaServicios");
        tbody.innerHTML = '';
        
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">No hay servicios registrados.</td></tr>';
            return;
        }

        data.forEach((servicio) => {
            const idServicio = servicio.ID_servicios;
            const nombre = servicio.Nombre_Servicio || '';
            
            // ✅ LECTURA CORRECTA: Usamos minúsculas porque así vienen de Supabase
            const horaSegun = servicio.hora_segun || '-'; 
            const undMedida = servicio.und_medida || '-'; 

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${idServicio}</strong></td>
                <td>${nombre}</td>
                <td>${horaSegun}</td>
                <td>${undMedida}</td>
                <td>
                    <button onclick="editarServicio(${idServicio})" class="btn-guardar-top" style="padding: 5px 10px; font-size: 0.8em;">Editar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    function mostrarFormularioServicio(modo) {
        document.getElementById('formServicio').reset();
        document.getElementById('servicioRowIndex').value = 0; 
        document.getElementById('tituloModalServicio').textContent = 'Añadir Nuevo Servicio';
        
        // Habilitar ID solo si quisieras ingresarlo manual (pero es SERIAL en tu DB, mejor que sea automático)
        // Recomendación: Dejarlo readonly o oculto para creación automática.
        document.getElementById('servicioID').value = "(Automático)";
        document.getElementById('servicioID').readOnly = true;
        document.getElementById('servicioID').style.backgroundColor = '#f5f5f5';
        
        mostrarModal('modalServicio');
    }

    function editarServicio(idServicio) {
        document.getElementById('tituloModalServicio').textContent = 'Cargando...';
        mostrarModal('modalServicio');
        
        google.script.run
            .withSuccessHandler(cargarFormularioServicio)
            .withFailureHandler(function(error) {
                alert("Error al cargar servicio: " + error);
                ocultarModal('modalServicio');
            })
            .obtenerServicioPorRowIndex(idServicio);
    }

    function cargarFormularioServicio(data) {
        if (!data || !data.row) {
            alert("Error al cargar los datos del servicio.");
            ocultarModal('modalServicio');
            return;
        }
        
        document.getElementById('tituloModalServicio').textContent = 'Editar Servicio';
        // data.row viene del backend simulando un array: [ID, Nombre, '', '', HoraSegun, UndMedida]
        // Ajustamos según lo que definiste en obtenerServicioPorRowIndex
        
        const datos = data.row;
        const idReal = datos[0];

        document.getElementById('servicioRowIndex').value = idReal; 
        document.getElementById('servicioID').value = idReal;
        document.getElementById('servicioDescripcion').value = datos[1] || '';
        
        // Asignar selects si hay coincidencia
        document.getElementById('servicioHoraSegun').value = datos[4] || '';
        document.getElementById('servicioUndMedida').value = datos[5] || '';
        
        document.getElementById('servicioID').readOnly = true;
        document.getElementById('servicioDescripcion').focus();
    }

    function guardarServicio() {
        const form = document.getElementById('formServicio');
        const data = {};
        const formData = new FormData(form);

        for (let [key, value] of formData.entries()) {
            data[key] = value;
        }
        
        data.rowIndex = document.getElementById('servicioRowIndex').value;
        
        if(data.rowIndex == 0) {
            delete data['ID Servicio'];
        }

        if (!data['Descripción del Servicio']) {
            alert("La descripción es obligatoria.");
            return;
        }
        
        // ✅ MAPEO LIMPIO PARA EL BACKEND
        data.DESCRIPCION = data['Descripción del Servicio'];
        data.HORA_SEGUN = data['Hora según'];
        data.UND_MEDIDA = data['Und. Medida'];
        
        // Ya NO sobrescribimos Tipo ni Abreviatura
        
        console.log("Enviando:", data);
        
        google.script.run
            .withSuccessHandler(function(resultado) {
                if (resultado.success) {
                    alert("Servicio guardado correctamente.");
                    refrescarTablaServicios();
                } else {
                    alert("Error al guardar: " + resultado.message);
                }
            })
            .withFailureHandler(function(error) {
                alert("Error de conexión: " + error.message);
            })
            .guardarOActualizarServicio(data);
    }
    
    function refrescarTablaServicios() {
        ocultarModal('modalServicio');
        google.script.run
            .withSuccessHandler(procesarDatosIniciales)
            .getDatosInicialesServicios(); 
    }
    
    function navegarAOT() {
        const urlBase = '<?!= getScriptUrl() ?>';
        window.open(urlBase + '?page=OT', '_blank');
    }
</script>
</body>
</html>
