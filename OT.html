<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>Órdenes de Trabajo</title>
    <?!= HtmlService.createHtmlOutputFromFile("Estilos").getContent(); ?>
</head>

<body>
    <div class="barraTopComercial">
        <div class="topBarra-izquierda">
            <? var url = getScriptUrl(); ?>
            <a href='<?= url ?>?page=Servicios' class="retornarModulos iconoTopBarra" id="retornarLink">← Volver a Servicios</a>
            <h1 id="tituloPrincipal">Órdenes de Trabajo</h1>
        </div>
        <div class="topBarra-derecha">
            <button onclick="navegarARegistrarOT(null)" class="boton-nuevo-pedido" id="btnRegistrarGlobal">
                📋 Registrar OT
            </button>
            <button onclick="recargarDatos()" class="btn-info" style="background-color: #17a2b8; color: white; margin-left: 10px;">
                🔄 Actualizar
            </button>
        </div>
    </div>

    <div class="contenedorModulos">
        <div class="card">
            <h2 id="subtituloCard">Lista de Órdenes de Trabajo</h2>
            <h3 id="subtituloCliente" style="color: #555; margin-top: -10px; display: none;"></h3>
            
            <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
                <input type="text" id="filtroOT" placeholder="Buscar por número OT, cliente o servicio..." 
                       style="padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px;">
                <span id="contadorOT" style="color: #666; font-size: 14px;">
                    Cargando...
                </span>
            </div>

            <div style="overflow-x: auto;">
                <table id="tablaOT" class="tabla-resumen">
                    <thead id="aotHeaders">
                        <tr>
                            <th style="width: 120px;">N° OT</th>
                            <th style="width: 150px;">Fecha</th>
                            <th style="min-width: 200px;">Cliente</th>
                            <th style="min-width: 200px;">Servicio/Máquina</th>
                            <th style="width: 120px;">Pedido</th>
                            <th style="width: 100px;">Horas Trab.</th>
                            <th style="width: 150px;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaOT">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 20px;">
                                <div class="loading-spinner">
                                    <p>Cargando órdenes de trabajo...</p>
                                    <div class="spinner"></div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <p id="loadingText">Cargando...</p>
            <div class="spinner"></div>
        </div>
    </div>

<script>
        let datosOTGlobal = []; // Para el modo global (ahora será un array de objetos JSON)
        let modoPedido = false;
        let numPedidoFiltrado = null;
        let scriptUrlBase = '<?!= getScriptUrl() ?>';

        document.addEventListener("DOMContentLoaded", function() {
            console.log("🔄 OT.html CARGADO (v3 - Migrado a Supabase)");

            const parametrosServidor = <?!= JSON.stringify(parametros) ?>;
            numPedidoFiltrado = parametrosServidor.pedido || null;

            if (numPedidoFiltrado) {
                modoPedido = true;
                console.log("Modo detectado: Pedido Aislado (" + numPedidoFiltrado + ")");
                configurarModoPedido(numPedidoFiltrado);
                // Llama a la nueva función v2 de Supabase
                cargarDatosOTPorPedido(numPedidoFiltrado);
            } else {
                modoPedido = false;
                console.log("Modo detectado: Global");
                configurarModoGlobal();
                // Llama a la nueva función v2 de Supabase
                cargarDatosOTGlobal();
            }
            
            document.getElementById("filtroOT").addEventListener("input", filtrarOT);
        });

        // --- LÓGICA DE MODO PEDIDO ---

        function configurarModoPedido(numPedido) {
            document.title = `OTs del Pedido ${numPedido}`;
            
            const retornarLink = document.getElementById("retornarLink");
            retornarLink.textContent = "← Volver al Pedido";
            retornarLink.href = `${scriptUrlBase}?page=Comercial&editar=${encodeURIComponent(numPedido)}`;
            
            document.getElementById("tituloPrincipal").textContent = `OTs del Pedido: ${numPedido}`;
            document.getElementById("subtituloCard").textContent = `Líneas de Servicio del Pedido`;
            document.getElementById("subtituloCliente").style.display = 'block';
            
            document.getElementById("filtroOT").style.display = 'none';
            document.getElementById("btnRegistrarGlobal").style.display = 'none';
            
            document.getElementById("aotHeaders").innerHTML = `
                <tr>
                    <th>Línea</th>
                    <th>Servicio (Descripción)</th>
                    <th>Horas Pedidas</th>
                    <th>Horas Despachadas</th>
                    <th>Saldo Horas</th>
                    <th>Acción</th>
                </tr>
            `;
        }

        function cargarDatosOTPorPedido(numPedido) {
            mostrarLoading(true, `Cargando líneas del pedido ${numPedido}...`);
            
            google.script.run
                .withSuccessHandler(function(resultado) {
                    mostrarLoading(false);
                    if (resultado.success) {
                        document.getElementById("subtituloCliente").textContent = `Cliente: ${resultado.cliente}`;
                        // Esta función no cambia, ya esperaba el formato JSON correcto
                        renderizarTablaModoPedido(resultado.lineas);
                    } else {
                        mostrarError(resultado.message);
                    }
                })
                .withFailureHandler(function(error) {
                    mostrarLoading(false);
                    mostrarError(error.message);
                })
                .getResumenOTPorPedido(numPedido); // <- Llama a la nueva función v2
        }
        
        function renderizarTablaModoPedido(lineas) {
            const tbody = document.getElementById("cuerpoTablaOT");
            tbody.innerHTML = "";
            console.log("Datos recibidos por renderizarTablaModoPedido:", lineas);

            if (!lineas || lineas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">No se encontraron líneas de servicio.</td></tr>`;
                return;
            }

            lineas.forEach(linea => {
                const saldo = linea.horasPedidas - linea.horasDespachadas;
                // Definir clase CSS para el saldo (puedes añadirla en Estilos.css)
                const saldoClase = saldo <= 0 ? 'saldo-negativo' : 'saldo-positivo'; 
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${escapeHTML(linea.lineaID.split('-L')[1] || 'N/A')}</strong></td>
                    <td>${escapeHTML(linea.descripcion)} (${escapeHTML(linea.cod)})</td>
                    <td class="monto-col">${linea.horasPedidas.toFixed(2)}</td>
                    <td class="monto-col">${linea.horasDespachadas.toFixed(2)}</td>
                    <td class="monto-col ${saldoClase}"><strong>${saldo.toFixed(2)}</strong></td>
                    <td>
                        <button onclick="navegarARegistrarOT('${escapeHTML(linea.lineaID)}')" class="boton-nuevo-pedido btn-success">
                            ➕ Nueva OT
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            actualizarContador(lineas.length);
        }

        // --- LÓGICA DE MODO GLOBAL (ACTUALIZADA) ---

        function configurarModoGlobal() {
            // Sin cambios
        }

        function cargarDatosOTGlobal() {
            mostrarLoading(true, "Cargando órdenes de trabajo...");
            
            google.script.run
                .withSuccessHandler(function(datosJSON) { // Ahora recibe JSON
                    mostrarLoading(false);
                    if (datosJSON && datosJSON.success === false) {
                         mostrarError("Error al cargar OT: " + datosJSON.message);
                         return;
                    }
                    datosOTGlobal = datosJSON || []; // Guarda el array de objetos JSON
                    renderizarTablaGlobal(datosOTGlobal);
                    actualizarContador(datosOTGlobal.length); // Ya no se resta 1 (no hay encabezado)
                })
                .withFailureHandler(function(error) {
                    mostrarLoading(false);
                    mostrarError("Error al cargar las órdenes de trabajo: " + error.message);
                })
                .getListaOT(); // <- Llama a la nueva función v2
        }
        
        /**
         * FUNCIÓN ACTUALIZADA: Lee JSON en lugar de un Array 2D
         */
        function renderizarTablaGlobal(datos) {
            const tbody = document.getElementById("cuerpoTablaOT");
            tbody.innerHTML = "";

            if (!datos || datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">No hay órdenes de trabajo registradas.</td></tr>`;
                return;
            }
            
            // Ya no necesitamos ordenar por fecha, la consulta SQL lo hace
            // Ya no usamos slice(1), 'datos' es un array de OTs puro

            datos.forEach((fila, index) => {
                // Leemos por nombre de propiedad, no por índice
                const numOT = fila.N_OT;
                const fecha = formatearFecha(fila.Fecha);
                const horasTrabajo = fila.Horometro_Trabajado_Horas;
                
                // Leemos los datos anidados
                // Es crucial añadir 'try...catch' o validaciones aquí por si
                // algún dato anidado viniera nulo
                let cliente = "Error de datos";
                let servicio = "Error de datos";
                let pedido = "Error de datos";

                if (fila.Detalle_Pedidos && fila.Detalle_Pedidos.Pedidos && fila.Detalle_Pedidos.Pedidos.Clientes) {
                    cliente = fila.Detalle_Pedidos.Pedidos.Clientes.Nombre_RazonSocial;
                }
                if (fila.Detalle_Pedidos && fila.Detalle_Pedidos.Servicios) {
                    servicio = fila.Detalle_Pedidos.Servicios.Nombre_Servicio;
                }
                if (fila.Detalle_Pedidos) {
                    pedido = fila.Detalle_Pedidos.Cot;
                }

                if (!numOT) return;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${escapeHTML(numOT)}</strong></td>
                    <td>${escapeHTML(fecha)}</td>
                    <td>${escapeHTML(cliente)}</td>
                    <td>${escapeHTML(servicio)}</td>
                    <td>${escapeHTML(pedido)}</td>
                    <td class="monto-col">${parseFloat(horasTrabajo || 0).toFixed(2)}</td>
                    <td>
                        <button onclick="editarOT('${escapeHTML(numOT)}')" class="btn-editar" title="Editar OT">
                            ✏️ Editar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /**
         * FUNCIÓN ACTUALIZADA: Filtra el array de objetos JSON
         */
        function filtrarOT() {
            if (modoPedido) return;
            
            const filtro = document.getElementById("filtroOT").value.toLowerCase().trim();
            if (!filtro) {
                renderizarTablaGlobal(datosOTGlobal);
                actualizarContador(datosOTGlobal.length);
                return;
            }

            const datosFiltrados = datosOTGlobal.filter(fila => {
                // Lectura segura de datos anidados
                const numOT = String(fila.N_OT || '').toLowerCase();
                const cliente = String(fila.Detalle_Pedidos?.Pedidos?.Clientes?.Nombre_RazonSocial || '').toLowerCase();
                const servicio = String(fila.Detalle_Pedidos?.Servicios?.Nombre_Servicio || '').toLowerCase();
                const pedido = String(fila.Detalle_Pedidos?.Cot || '').toLowerCase();
                
                return numOT.includes(filtro) || cliente.includes(filtro) || 
                       servicio.includes(filtro) || pedido.includes(filtro);
            });
            
            renderizarTablaGlobal(datosFiltrados);
            actualizarContador(datosFiltrados.length, true);
        }

        /**
         * FUNCIÓN ACTUALIZADA: Lee el .length del array de objetos
         */
        function actualizarContador(total = 0, esFiltrado = false) {
            const contador = document.getElementById("contadorOT");
            if (modoPedido) {
                contador.textContent = `${total} líneas de servicio`;
                contador.style.color = '#3498db';
                return;
            }

            const totalGlobal = datosOTGlobal.length; // Ya no se resta 1
            if (esFiltrado) {
                contador.textContent = `${total} de ${totalGlobal} registros`;
                contador.style.color = '#e67e22';
            } else {
                contador.textContent = `${total} registros encontrados`;
                contador.style.color = total > 0 ? '#27ae60' : '#666';
            }
        }

        // --- FUNCIONES COMUNES (Sin cambios) ---
        
        function navegarARegistrarOT(lineaID = null) {
            let urlDestino = '';
            if (lineaID) {
                console.log(`🔗 Navegando a Registrar OT para Línea: ${lineaID}`);
                urlDestino = `${scriptUrlBase}?page=RegistrarOT&linea=${encodeURIComponent(lineaID)}`;
            } else {
                console.log("🔗 Navegando a Registrar OT (Global)");
                urlDestino = `${scriptUrlBase}?page=RegistrarOT`;
            }
            window.open(urlDestino, '_blank');
        }

        function editarOT(numOT) {
            console.log("✏️ Editando OT (Global): " + numOT);
            const urlEditarOT = scriptUrlBase + '?page=RegistrarOT&editar=' + encodeURIComponent(numOT);
            window.open(urlEditarOT, '_blank');
        }

        function recargarDatos() {
            console.log("🔄 Recargando datos...");
            if (modoPedido) {
                cargarDatosOTPorPedido(numPedidoFiltrado);
            } else {
                cargarDatosOTGlobal();
            }
        }

        function formatearFecha(fechaStr) {
            if (!fechaStr) return '-';
            try {
                // Las fechas de Supabase (tipo DATE) vienen como 'YYYY-MM-DD'
                const partes = fechaStr.split('-');
                if (partes.length === 3) {
                    // Reordenar a DD/MM/YYYY
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
                // Fallback para fechas completas (TIMESTAMPTZ)
                const fecha = new Date(fechaStr);
                if (isNaN(fecha.getTime())) return fechaStr;
                return fecha.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch (e) { return fechaStr; }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function mostrarLoading(mostrar, mensaje = "Cargando...") {
            const overlay = document.getElementById("loadingOverlay");
            if (overlay) overlay.style.display = mostrar ? "flex" : "none";
            const texto = document.getElementById("loadingText");
            if (texto) texto.textContent = mensaje;
        }

        function mostrarError(mensaje) {
            console.error("❌ Error:", mensaje);
            alert("❌ " + mensaje);
        }
    </script>
</body>
</html>
